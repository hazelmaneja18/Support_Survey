<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisor Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      background-color: #f0f4f8;
      padding: 30px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }
    /* Brand Header Alignment */
    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-mark {
      height: 32px;
      width: auto;
      object-fit: contain;
    }
    .brand-name {
      font-weight: 800;
      font-size: 24px;
      color: #0b111e;
      letter-spacing: -0.5px;
    }
    .btn-home {
      border: 1px solid #00a884;
      background: transparent;
      color: #00a884;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }
    .btn-home:hover {
      background: #e6f7f3;
    }
    h2 {
      font-size: 18px;
      color: #0b111e;
      margin-bottom: 15px;
    }
    .form-inline {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .form-inline input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
    }
    .btn-add {
      background-color: #00a884;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #eaecf0;
      padding: 10px;
      text-align: left;
      font-size: 13px;
    }
    th {
      background-color: #f9fafb;
      color: #475467;
    }
    .btn-delete {
      background-color: #d92d20;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-delete:hover {
      background-color: #b42318;
    }
    .locked-text {
      color: #98a2b3;
      font-size: 12px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="brand-header">
        <div class="logo-container">
          <img src="logo.png" alt="Verifone Symbol" class="logo-mark" />
          <span class="brand-name">verifone</span>
        </div>
        <a href="index.html" class="btn-home">← Back to Form</a>
      </div>
      <h2>Supervisor Dashboard</h2>
    </div>

    <!-- Manage Support Roster -->
    <div class="card">
      <h2>Manage Support Roster</h2>
      <div class="form-inline">
        <input type="text" id="newSupportName" placeholder="Support Member Name">
        <input type="text" id="newSupportTeam" placeholder="Team (e.g. Team A)">
        <button class="btn-add" onclick="addSupportMember()">Add Support</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Team</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="rosterTableBody"></tbody>
      </table>
    </div>

    <!-- Detailed Audit Log -->
    <div class="card">
      <h2>Detailed Audit Log</h2>
      <table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Agent Name</th>
            <th>Support Person</th>
            <th>Rating</th>
            <th>Comments</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="auditTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      renderRosterTable();
      renderAuditTable();
    });

    // Support Roster Functions
    function getRoster() {
      const defaultRoster = [
        { name: "John Doe", team: "Team A" },
        { name: "Jane Smith", team: "Team B" }
      ];
      return JSON.parse(localStorage.getItem("supportRoster")) || defaultRoster;
    }

    function renderRosterTable() {
      const roster = getRoster();
      const tbody = document.getElementById("rosterTableBody");
      tbody.innerHTML = "";

      roster.forEach((item, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item.name}</td>
          <td>${item.team}</td>
          <td><button class="btn-delete" onclick="deleteSupportMember(${index})">Delete</button></td>
        `;
        tbody.appendChild(row);
      });
    }

    function addSupportMember() {
      const nameInput = document.getElementById("newSupportName");
      const teamInput = document.getElementById("newSupportTeam");
      if (!nameInput.value || !teamInput.value) {
        alert("Please fill in both name and team.");
        return;
      }

      const roster = getRoster();
      roster.push({ name: nameInput.value, team: teamInput.value });
      localStorage.setItem("supportRoster", JSON.stringify(roster));
      
      nameInput.value = "";
      teamInput.value = "";
      renderRosterTable();
    }

    function deleteSupportMember(index) {
      const roster = getRoster();
      roster.splice(index, 1);
      localStorage.setItem("supportRoster", JSON.stringify(roster));
      renderRosterTable();
    }

    // Detailed Audit Log Functions
    function renderAuditTable() {
      const records = JSON.parse(localStorage.getItem("auditLogs")) || [];
      const tbody = document.getElementById("auditTableBody");
      tbody.innerHTML = "";

      records.forEach((record, index) => {
        const row = document.createElement("tr");
        
        // Strict Check: Only render Delete button if comment contains "test" (case-insensitive)
        const isTestRecord = record.comments && record.comments.toLowerCase().includes("test");
        const deleteButtonHTML = isTestRecord 
          ? `<button class="btn-delete" onclick="deleteAuditRecord(${index})">Delete</button>` 
          : `<span class="locked-text">Protected</span>`;

        row.innerHTML = `
          <td>${record.timestamp || ''}</td>
          <td>${record.agentName || ''}</td>
          <td>${record.supportPerson || ''}</td>
          <td>${record.rating || ''}</td>
          <td>${record.comments || ''}</td>
          <td>${deleteButtonHTML}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function deleteAuditRecord(index) {
      if (confirm("Are you sure you want to delete this test entry?")) {
        const records = JSON.parse(localStorage.getItem("auditLogs")) || [];
        records.splice(index, 1);
        localStorage.setItem("auditLogs", JSON.stringify(records));
        renderAuditTable();
      }
    }
  </script>
</body>
</html>
