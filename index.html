<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifone | Support Service Rating</title>
    <style>
        :root {
            --bg-base: #f0f4f8;
            --card-bg: rgba(255, 255, 255, 0.90);
            --card-border: rgba(203, 213, 225, 0.6);
            --primary-dark: #0f172a;
            --accent-teal: #0d9488;
            --accent-teal-light: #ccfbf1;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 50%, #e0f2fe 100%);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 40px 35px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .verifone-logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .verifone-mark {
            height: 32px;
            width: 32px;
        }

        .verifone-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: -0.8px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .btn-supervisor {
            background: #ffffff;
            color: var(--accent-teal);
            border: 1px solid var(--accent-teal);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-supervisor:hover {
            background: var(--accent-teal);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
        }

        .title-block {
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            color: var(--primary-dark);
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px 0;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .quote-banner {
            background: var(--accent-teal-light);
            border-left: 4px solid var(--accent-teal);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 25px;
            font-style: italic;
            font-size: 13px;
            color: #0f766e;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        input[type="text"], select, textarea {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            padding: 11px 14px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }

        textarea {
            height: 85px;
            resize: vertical;
        }

        .btn-submit {
            background: var(--accent-teal);
            color: #ffffff;
            border: none;
            padding: 13px;
            width: 100%;
            font-weight: 700;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background: #0f766e;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-top">
            <div class="verifone-logo-wrapper">
                <svg class="verifone-mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="25" cy="20" r="12" fill="#0f172a"/>
                    <circle cx="25" cy="55" r="12" fill="#0f172a"/>
                    <circle cx="50" cy="80" r="12" fill="#0f172a"/>
                    <path d="M75 20C75 20 87 35 75 55C63 75 75 90 75 90" stroke="#0f172a" stroke-width="24" stroke-linecap="round"/>
                </svg>
                <span class="verifone-text">verifone</span>
            </div>
            <a href="supervisor.html" target="_blank" class="btn-supervisor">
                🔒 Supervisor Access
            </a>
        </div>

        <div class="title-block">
            <h2>SUPPORT SERVICE RATING</h2>
            <div class="subtitle">Technical Support Assistance Feedback</div>
        </div>

        <div class="quote-banner">
            "Excellence is not an act, but a habit. Your feedback drives our continuous improvement."
        </div>

        <form id="ratingForm">
            <div class="form-group">
                <label for="agentUser">Agent Name / ID:</label>
                <input type="text" id="agentUser" placeholder="e.g. Jane Doe / hmaneja" required>
            </div>

            <div class="form-group">
                <label for="caseNumber">Case Number:</label>
                <input type="text" id="caseNumber" placeholder="Enter support case number" required>
            </div>

            <div class="form-group">
                <label for="supportPerson">Support Person Assisting You:</label>
                <select id="supportPerson" required>
                    <option value="">-- Select Support Person --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="rating">Rating (1 - 5 Stars):</label>
                <select id="rating" required>
                    <option value="">-- Select Rating --</option>
                    <option value="5">5 ★★★★★ - Excellent Assistance</option>
                    <option value="4">4 ★★★★☆ - Good Support</option>
                    <option value="3">3 ★★★☆☆ - Average</option>
                    <option value="2">2 ★★☆☆☆ - Needs Improvement</option>
                    <option value="1">1 ★☆☆☆☆ - Poor</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Notes & Constructive Feedback:</label>
                <textarea id="notes" placeholder="Provide additional details regarding the assistance received..."></textarea>
            </div>

            <button type="submit" class="btn-submit">SUBMIT FEEDBACK</button>
        </form>
    </div>

    <script>
        const defaultRoster = [
            { name: "Donald Sayers", team: "Tucson" },
            { name: "Gerardo Morales", team: "Tucson" },
            { name: "James Warder", team: "Tucson" },
            { name: "Jesse McQueary", team: "Tucson" },
            { name: "Justine Santa Cruz", team: "Tucson" },
            { name: "Kimber Dawson", team: "Tucson" },
            { name: "Robert Hasson", team: "Tucson" },
            { name: "Wendy Franco", team: "Tucson" },
            { name: "Judy Tolentino", team: "Manila" },
            { name: "Aj Dela Cruz", team: "Manila" },
            { name: "Melvin Lagrosa", team: "Manila" },
            { name: "Kristian Ong", team: "Manila" },
            { name: "Zachary Jeremy Payabyab", team: "Manila" },
            { name: "Christian Mark Patdu", team: "Manila" },
            { name: "Glory Barbacena", team: "Manila" },
            { name: "Gemmalyn Silvestre", team: "Manila" }
        ];

        if (!localStorage.getItem('supportRoster')) {
            localStorage.setItem('supportRoster', JSON.stringify(defaultRoster));
        }

        function loadSupportDropdown() {
            const roster = JSON.parse(localStorage.getItem('supportRoster')) || defaultRoster;
            const select = document.getElementById('supportPerson');
            select.innerHTML = '<option value="">-- Select Support Person --</option>';

            const teams = ['Tucson', 'Manila'];
            teams.forEach(team => {
                const optgroup = document.createElement('optgroup');
                optgroup.label = `${team} Support Team`;
                roster.filter(member => member.team === team).forEach(member => {
                    const opt = document.createElement('option');
                    opt.value = member.name;
                    opt.textContent = member.name;
                    optgroup.appendChild(opt);
                });
                select.appendChild(optgroup);
            });
        }

        loadSupportDropdown();

        document.getElementById('ratingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const roster = JSON.parse(localStorage.getItem('supportRoster')) || defaultRoster;
            const selectedName = document.getElementById('supportPerson').value;
            const personObj = roster.find(m => m.name === selectedName);

            const now = new Date();
            const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const formattedDate = `${now.getMonth()+1}/${now.getDate()}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const newEntry = {
                id: Date.now(),
                timestamp: formattedDate,
                monthKey: monthKey,
                agentUser: document.getElementById('agentUser').value.trim(),
                caseNumber: document.getElementById('caseNumber').value.trim(),
                supportName: selectedName,
                team: personObj ? personObj.team : 'Unknown',
                rating: parseInt(document.getElementById('rating').value),
                comments: document.getElementById('notes').value.trim()
            };

            const submissions = JSON.parse(localStorage.getItem('supportRatings')) || [];
            submissions.unshift(newEntry);
            localStorage.setItem('supportRatings', JSON.stringify(submissions));

            alert('Thank you! Your feedback has been recorded.');
            this.reset();
        });
    </script>
</body>
</html>
