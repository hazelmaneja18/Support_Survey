<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifone | Support Service Rating</title>
    <style>
        :root {
            --bg-base: #f0f4f8;
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-border: rgba(203, 213, 225, 0.6);
            --primary-dark: #0f172a;
            --accent-teal: #0d9488;
            --accent-teal-light: #ccfbf1;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --danger-red: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 50%, #e0f2fe 100%);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 40px 35px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .verifone-logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .verifone-mark {
            height: 32px;
            width: 32px;
        }

        .verifone-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: -0.8px;
        }

        .btn-supervisor {
            background: #ffffff;
            color: var(--accent-teal);
            border: 1px solid var(--accent-teal);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-supervisor:hover {
            background: var(--accent-teal);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
        }

        .title-block {
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            color: var(--primary-dark);
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px 0;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .quote-banner {
            background: var(--accent-teal-light);
            border-left: 4px solid var(--accent-teal);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 25px;
            font-style: italic;
            font-size: 13px;
            color: #0f766e;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .credit-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
        }

        .badge-success {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }

        .badge-warning {
            background-color: #fef9c3;
            color: #a16207;
            border: 1px solid #fde047;
        }

        .badge-danger {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        input[type="text"], select, textarea {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            padding: 11px 14px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }

        textarea {
            height: 85px;
            resize: vertical;
        }

        .btn-submit {
            background: var(--accent-teal);
            color: #ffffff;
            border: none;
            padding: 13px;
            width: 100%;
            font-weight: 700;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background: #0f766e;
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .custom-input-box {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hidden {
            display: none !important;
        }

        optgroup {
            font-weight: 700;
            color: var(--accent-teal);
        }
    </style>
</head>

    <div class="container">
        <div class="header-top">
            <div class="verifone-logo-wrapper">
                <svg class="verifone-mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="22" r="10" fill="#0f172a"/>
                    <circle cx="20" cy="52" r="10" fill="#0f172a"/>
                    <circle cx="56" cy="22" r="10" fill="#0f172a"/>
                    <circle cx="56" cy="52" r="10" fill="#0f172a"/>
                    <rect x="46" y="22" width="20" height="30" fill="#0f172a"/>
                    <circle cx="38" cy="82" r="10" fill="#0f172a"/>
                </svg>
                <span class="verifone-text">verifone</span>
            </div>
            <a href="supervisor.html" target="_blank" class="btn-supervisor">
                🔒 Supervisor Access
            </a>
        </div>

        <div class="title-block">
            <h2>SUPPORT SERVICE RATING</h2>
            <div class="subtitle">Technical Support Assistance Feedback</div>
        </div>

        <div class="quote-banner">
            "Excellence is not an act, but a habit. Your feedback drives our continuous improvement."
        </div>

        <form id="ratingForm">
            <!-- AGENT NAME SECTION -->
            <div class="form-group">
                <label for="agentUser">
                    <span>Agent Name:</span>
                    <span id="creditBadge" class="credit-badge hidden"></span>
                </label>
                <select id="agentUser" required onchange="handleAgentChange()">
                    <option value="">-- Select Your Name --</option>
                    <optgroup label="Manila" id="agent-opt-manila"></optgroup>
                    <optgroup label="Tucson" id="agent-opt-tucson"></optgroup>
                    <optgroup label="Bangalore" id="agent-opt-bangalore"></optgroup>
                    <optgroup label="MIS - Canada" id="agent-opt-canada"></optgroup>
                    <option value="__CUSTOM_AGENT__">+ Type Custom Agent Name...</option>
                </select>

                <div id="customAgentContainer" class="custom-input-box hidden">
                    <input type="text" id="customAgentInput" placeholder="Enter full agent name">
                </div>
            </div>

            <!-- SUPPORT PERSON SECTION -->
            <div class="form-group">
                <label for="supportPerson">Support Person Assisting You:</label>
                <select id="supportPerson" required onchange="handleSupportChange()">
                    <option value="">-- Select Support Person --</option>
                    <optgroup label="Manila Support" id="support-opt-manila"></optgroup>
                    <optgroup label="Tucson Support" id="support-opt-tucson"></optgroup>
                    <option value="__CUSTOM_SUPPORT__">+ Type Custom Support Name...</option>
                </select>

                <div id="customSupportContainer" class="custom-input-box hidden">
                    <input type="text" id="customSupportInput" placeholder="Enter support person name">
                    <select id="customSupportTeam">
                        <option value="Manila">Manila Team</option>
                        <option value="Tucson">Tucson Team</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="rating">Rating (1 - 5 Stars):</label>
                <select id="rating" required>
                    <option value="">-- Select Rating --</option>
                    <option value="5">5 ★★★★★ - Excellent Assistance</option>
                    <option value="4">4 ★★★★☆ - Good Support</option>
                    <option value="3">3 ★★★☆☆ - Average</option>
                    <option value="2">2 ★★☆☆☆ - Needs Improvement</option>
                    <option value="1">1 ★☆☆☆☆ - Poor</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Notes & Constructive Feedback:</label>
                <textarea id="notes" placeholder="Provide additional details regarding the assistance received..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">SUBMIT FEEDBACK</button>
        </form>
    </div>

        function loadAgentDropdown() {
            const agents = JSON.parse(localStorage.getItem('agentRoster')) || defaultAgents;

            const mnlGroup = document.getElementById('agent-opt-manila');
            const tucGroup = document.getElementById('agent-opt-tucson');
            const blrGroup = document.getElementById('agent-opt-bangalore');
            const canGroup = document.getElementById('agent-opt-canada');

            mnlGroup.innerHTML = '';
            tucGroup.innerHTML = '';
            blrGroup.innerHTML = '';
            canGroup.innerHTML = '';

            agents.sort((a, b) => a.name.localeCompare(b.name)).forEach(agent => {
                const opt = document.createElement('option');
                opt.value = agent.name;
                opt.textContent = agent.name;

                const loc = (agent.location || '').toLowerCase();
                if (loc.includes('manila') || loc.includes('mnl')) mnlGroup.appendChild(opt);
                else if (loc.includes('tucson') || loc.includes('tus')) tucGroup.appendChild(opt);
                else if (loc.includes('bangalore') || loc.includes('blr')) blrGroup.appendChild(opt);
                else if (loc.includes('canada') || loc.includes('mis')) canGroup.appendChild(opt);
                else mnlGroup.appendChild(opt);
            });
        }

        function loadSupportDropdown() {
            const roster = JSON.parse(localStorage.getItem('supportRoster')) || defaultRoster;

            const mnlGroup = document.getElementById('support-opt-manila');
            const tucGroup = document.getElementById('support-opt-tucson');

            mnlGroup.innerHTML = '';
            tucGroup.innerHTML = '';

            roster.forEach(member => {
                const opt = document.createElement('option');
                opt.value = member.name;
                opt.textContent = member.name;

                if (member.team === 'Manila') mnlGroup.appendChild(opt);
                else tucGroup.appendChild(opt);
            });
        }

            const selectVal = document.getElementById('agentUser').value;

                customInput.required = true;
            } else {
                customBox.classList.add('hidden');
                customInput.required = false;
            }

            checkAgentCredits();
        }

            }
        }

        function getAgentRemainingCredits(agentName) {
            if (!agentName) return INITIAL_CREDITS;
            const submissions = JSON.parse(localStorage.getItem('supportRatings')) || [];
            const agentSubmissions = submissions.filter(s => s.agentUser.toLowerCase() === agentName.toLowerCase());
            return Math.max(0, INITIAL_CREDITS - agentSubmissions.length);
        }

        function checkAgentCredits() {
            let selectVal = document.getElementById('agentUser').value;
            let agentName = selectVal;

            if (selectVal === '__CUSTOM_AGENT__') {
                agentName = document.getElementById('customAgentInput').value.trim();
            }

            const badge = document.getElementById('creditBadge');
            const submitBtn = document.getElementById('submitBtn');

            if (!agentName) {
                badge.classList.add('hidden');
                submitBtn.disabled = false;
                return;
            }

            const remaining = getAgentRemainingCredits(agentName);
            badge.classList.remove('hidden', 'badge-success', 'badge-warning', 'badge-danger');
            badge.textContent = `${remaining} / ${INITIAL_CREDITS} Credits Left`;

            if (remaining > 2) {
                badge.classList.add('badge-success');
                submitBtn.disabled = false;
            } else if (remaining > 0) {
                badge.classList.add('badge-warning');
                submitBtn.disabled = false;
            } else {
                badge.classList.add('badge-danger');
                badge.textContent = "0 Credits Left (Limit Reached)";
                submitBtn.disabled = true;
            }
        }

        document.getElementById('customAgentInput').addEventListener('input', checkAgentCredits);

        loadAgentDropdown();
        loadSupportDropdown();

        document.getElementById('ratingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let selectedAgent = document.getElementById('agentUser').value;
            if (selectedAgent === '__CUSTOM_AGENT__') {
                selectedAgent = document.getElementById('customAgentInput').value.trim();
            }

            const creditsLeft = getAgentRemainingCredits(selectedAgent);

            if (creditsLeft <= 0) {
                alert('You have used all 4 feedback submission credits.');
                return;
            }

            let selectedSupport = document.getElementById('supportPerson').value;
            let supportTeam = 'Unknown';

            if (selectedSupport === '__CUSTOM_SUPPORT__') {
                selectedSupport = document.getElementById('customSupportInput').value.trim();
                supportTeam = document.getElementById('customSupportTeam').value;
            } else {
                const roster = JSON.parse(localStorage.getItem('supportRoster')) || defaultRoster;
                const personObj = roster.find(m => m.name === selectedSupport);
                if (personObj) supportTeam = personObj.team;
            }

            const now = new Date();
            const dateISO = now.toISOString().split('T')[0];
            const yearStr = String(now.getFullYear());
            
            const tempDate = new Date(now.valueOf());
            const dayNum = (now.getDay() + 6) % 7;
            tempDate.setDate(tempDate.getDate() - dayNum + 3);
            const firstThursday = tempDate.valueOf();
            tempDate.setMonth(0, 1);
            if (tempDate.getDay() !== 4) {
                tempDate.setMonth(0, 1 + ((4 - tempDate.getDay() + 7) % 7));
            }
            const weekNum = 1 + Math.round((firstThursday - tempDate.valueOf()) / 604800000);

            const formattedDate = `${now.getMonth()+1}/${now.getDate()}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const newEntry = {
                id: Date.now(),
                timestamp: formattedDate,
                dateISO: dateISO,
                year: yearStr,
                week: String(weekNum),
                agentUser: selectedAgent,
                caseNumber: "N/A",
                supportName: selectedSupport,
                team: supportTeam,
                rating: parseInt(document.getElementById('rating').value),
                comments: document.getElementById('notes').value.trim()
            };

            const submissions = JSON.parse(localStorage.getItem('supportRatings')) || [];
            submissions.unshift(newEntry);
            localStorage.setItem('supportRatings', JSON.stringify(submissions));

            alert(`Thank you! Your feedback has been recorded. You have ${creditsLeft - 1} credit(s) remaining.`);
            this.reset();
            document.getElementById('customAgentContainer').classList.add('hidden');
            document.getElementById('customSupportContainer').classList.add('hidden');
            checkAgentCredits();
        });
    </script>
</body>
</html>
