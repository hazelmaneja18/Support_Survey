<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Service Rating</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 650px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    /* Brand Header Alignment */
    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-mark {
      height: 32px;
      width: auto;
      object-fit: contain;
    }
    .brand-name {
      font-weight: 800;
      font-size: 24px;
      color: #0b111e;
      letter-spacing: -0.5px;
    }
    .btn-supervisor {
      border: 1px solid #00a884;
      background: transparent;
      color: #00a884;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }
    .btn-supervisor:hover {
      background: #e6f7f3;
    }
    .form-title {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #0b111e;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .form-subtitle {
      text-align: center;
      color: #667085;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .quote-box {
      background-color: #e6fdf7;
      border-left: 4px solid #00a884;
      padding: 12px 16px;
      border-radius: 4px;
      font-style: italic;
      color: #007a60;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 600;
      color: #344054;
      font-size: 14px;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #00a884;
    }
    .btn-submit {
      width: 100%;
      background-color: #00a884;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:hover {
      background-color: #008f70;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-header">
      <div class="logo-container">
        <img src="logo.png" alt="Verifone Symbol" class="logo-mark" />
        <span class="brand-name">verifone</span>
      </div>
      <a href="supervisor.html" class="btn-supervisor">🔒 Supervisor Access</a>
    </div>

    <div class="form-title">SUPPORT SERVICE RATING</div>
    <div class="form-subtitle">Technical Support Assistance Feedback</div>

    <div class="quote-box">
      "Excellence is not an act, but a habit. Your feedback drives our continuous improvement."
    </div>

    <form id="ratingForm">
      <div class="form-group">
        <label for="agentName">Agent Name / ID:</label>
        <input type="text" id="agentName" required placeholder="Enter your name or ID">
      </div>

      <div class="form-group">
        <label for="supportPerson">Support Person Assisting You:</label>
        <select id="supportPerson" required>
          <option value="">Select Support Person...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="rating">Rating (1 - 5 Stars):</label>
        <select id="rating" required>
          <option value="">Select Rating...</option>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Good</option>
          <option value="3">3 - Average</option>
          <option value="2">2 - Poor</option>
          <option value="1">1 - Very Poor</option>
        </select>
      </div>

      <div class="form-group">
        <label for="comments">Comments / Feedback:</label>
        <textarea id="comments" rows="3" placeholder="Provide details (use 'Test' for test submissions)"></textarea>
      </div>

      <button type="submit" class="btn-submit">Submit Feedback</button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      loadSupportDropdown();
    });

    function loadSupportDropdown() {
      const select = document.getElementById("supportPerson");
      const defaultRoster = [
        { name: "John Doe", team: "Team A" },
        { name: "Jane Smith", team: "Team B" }
      ];
      
      const roster = JSON.parse(localStorage.getItem("supportRoster")) || defaultRoster;
      select.innerHTML = '<option value="">Select Support Person...</option>';

      // Group by team
      const teams = {};
      roster.forEach(item => {
        if (!teams[item.team]) teams[item.team] = [];
        teams[item.team].push(item.name);
      });

      for (const team in teams) {
        const group = document.createElement("optgroup");
        group.label = team;
        teams[team].forEach(person => {
          const opt = document.createElement("option");
          opt.value = person;
          opt.textContent = person;
          group.appendChild(opt);
        });
        select.appendChild(group);
      }
    }

    document.getElementById("ratingForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const newRecord = {
        timestamp: new Date().toLocaleString(),
        agentName: document.getElementById("agentName").value,
        supportPerson: document.getElementById("supportPerson").value,
        rating: document.getElementById("rating").value,
        comments: document.getElementById("comments").value
      };

      const existingLogs = JSON.parse(localStorage.getItem("auditLogs")) || [];
      existingLogs.push(newRecord);
      localStorage.setItem("auditLogs", JSON.stringify(existingLogs));

      alert("Feedback submitted successfully!");
      this.reset();
    });
  </script>
</body>
</html>
