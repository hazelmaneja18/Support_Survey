<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifone | Support Service Rating</title>
    <style>
        :root {
            --bg-base: #f0f4f8;
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-border: rgba(203, 213, 225, 0.6);
            --primary-dark: #0f172a;
            --accent-teal: #0d9488;
            --accent-teal-light: #ccfbf1;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --danger-red: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 50%, #e0f2fe 100%);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 40px 35px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .verifone-logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .verifone-mark {
            height: 32px;
            width: 32px;
        }

        .verifone-text {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: -0.8px;
        }

        .btn-supervisor {
            background: #ffffff;
            color: var(--accent-teal);
            border: 1px solid var(--accent-teal);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-supervisor:hover {
            background: var(--accent-teal);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
        }

        .title-block {
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            color: var(--primary-dark);
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px 0;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .quote-banner {
            background: var(--accent-teal-light);
            border-left: 4px solid var(--accent-teal);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 25px;
            font-style: italic;
            font-size: 13px;
            color: #0f766e;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .required-mark {
            color: var(--danger-red);
            margin-left: 3px;
        }

        .credit-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
        }

        .badge-success {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #86efac;
        }

        .badge-warning {
            background-color: #fef9c3;
            color: #a16207;
            border: 1px solid #fde047;
        }

        .badge-danger {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        input[type="text"], select, textarea {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            padding: 11px 14px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }

        textarea {
            height: 85px;
            resize: vertical;
        }

        textarea.notes-missing {
            border-color: var(--danger-red);
        }

        .notes-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .notes-hint.notes-hint-warning {
            color: var(--danger-red);
            font-weight: 600;
        }

        .btn-submit {
            background: var(--accent-teal);
            color: #ffffff;
            border: none;
            padding: 13px;
            width: 100%;
            font-weight: 700;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background: #0f766e;
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .custom-input-box {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hidden {
            display: none !important;
        }

        optgroup {
            font-weight: 700;
            color: var(--accent-teal);
        }

        .limit-notice-warning {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-top">
            <div class="verifone-logo-wrapper">
                <svg class="verifone-mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="22" r="10" fill="#0f172a"/>
                    <circle cx="20" cy="52" r="10" fill="#0f172a"/>
                    <circle cx="56" cy="22" r="10" fill="#0f172a"/>
                    <circle cx="56" cy="52" r="10" fill="#0f172a"/>
                    <rect x="46" y="22" width="20" height="30" fill="#0f172a"/>
                    <circle cx="38" cy="82" r="10" fill="#0f172a"/>
                </svg>
                <span class="verifone-text">verifone</span>
            </div>
            <a href="supervisor.html" target="_blank" class="btn-supervisor">
                🔒 Supervisor Access
            </a>
        </div>

        <div class="title-block">
            <h2>SUPPORT SERVICE RATING</h2>
            <div class="subtitle">Technical Support Assistance Feedback</div>
        </div>

        <div class="quote-banner">
            "Excellence is not an act, but a habit. Your feedback drives our continuous improvement."
        </div>

        <form id="ratingForm">
            <!-- AGENT NAME SECTION -->
            <div class="form-group">
                <label for="agentUser">
                    <span>Agent Name:</span>
                    <span id="creditBadge" class="credit-badge hidden"></span>
                </label>
                <select id="agentUser" required onchange="handleAgentChange()">
                    <option value="">-- Select Your Name --</option>
                    <optgroup label="Manila" id="agent-opt-manila"></optgroup>
                    <optgroup label="Tucson" id="agent-opt-tucson"></optgroup>
                    <optgroup label="Bangalore" id="agent-opt-bangalore"></optgroup>
                    <optgroup label="MIS - Canada" id="agent-opt-canada"></optgroup>
                    <option value="__CUSTOM_AGENT__">+ Type Custom Agent Name...</option>
                </select>

                <div id="customAgentContainer" class="custom-input-box hidden">
                    <input type="text" id="customAgentInput" placeholder="Enter full agent name">
                </div>
            </div>

            <!-- SUPPORT PERSON SECTION -->
            <div class="form-group">
                <label for="supportPerson">Support Person Assisting You:</label>
                <select id="supportPerson" required onchange="handleSupportChange()">
                    <option value="">-- Select Support Person --</option>
                    <optgroup label="Manila Support" id="support-opt-manila"></optgroup>
                    <optgroup label="Tucson Support" id="support-opt-tucson"></optgroup>
                    <option value="__CUSTOM_SUPPORT__">+ Type Custom Support Name...</option>
                </select>

                <div id="customSupportContainer" class="custom-input-box hidden">
                    <input type="text" id="customSupportInput" placeholder="Enter support person name">
                    <select id="customSupportTeam">
                        <option value="Manila">Manila Team</option>
                        <option value="Tucson">Tucson Team</option>
                    </select>
                </div>

                <p id="supportLimitNotice" class="hidden" style="font-size: 12px; margin-top: 8px; padding: 8px 10px; border-radius: 6px;"></p>
            </div>

            <div class="form-group">
                <label for="rating">Rating (1 - 5 Stars):</label>
                <select id="rating" required>
                    <option value="">-- Select Rating --</option>
                    <option value="5">5 ★★★★★ - Excellent Assistance</option>
                    <option value="4">4 ★★★★☆ - Good Support</option>
                    <option value="3">3 ★★★☆☆ - Average</option>
                    <option value="2">2 ★★☆☆☆ - Needs Improvement</option>
                    <option value="1">1 ★☆☆☆☆ - Poor</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">
                    <span>Notes &amp; Constructive Feedback:<span class="required-mark">*</span></span>
                </label>
                <textarea id="notes" required placeholder="Provide additional details regarding the assistance received... (minimum 20 words)"></textarea>
                <p id="notesHint" class="notes-hint">Please provide at least 20 words of feedback (0 / 20 words so far).</p>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit" disabled>SUBMIT FEEDBACK</button>
        </form>
    </div>

    <!-- ===================== FIREBASE ===================== -->
    <!-- firebase-config.js defines window.FIREBASE_CONFIG. It is NOT committed
         to source control (see .gitignore) - in production it is generated at
         deploy time from GitHub Actions secrets. This file MUST use the exact
         same Firebase project as supervisor.html so both pages read/write the
         same database. For local testing, copy firebase-config.example.js to
         firebase-config.js and fill in real values. -->
    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
        if (!window.FIREBASE_CONFIG) {
            alert('Configuration missing: firebase-config.js was not found or did not load. Contact your administrator.');
            throw new Error('FIREBASE_CONFIG is not defined. See firebase-config.example.js.');
        }
        const firebaseConfig = window.FIREBASE_CONFIG;
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const FEEDBACK_COLLECTION = "feedback";
        const AGENT_COLLECTION = "agentRoster";
        const SUPPORT_COLLECTION = "supportRoster";
    </script>
    <!-- ======================================================= -->

    <script>
        const INITIAL_CREDITS = 4;

        // No agent/support names are hardcoded here anymore - everything
        // comes from Firestore, managed by a supervisor in supervisor.html
        // (added one at a time, or bulk-loaded via the Excel import).

        // ---------------------------------------------------------------
        // Live, in-memory mirrors of the Firestore collections. These are
        // kept up to date automatically by onSnapshot() listeners below, so
        // the rest of the app's logic can read them exactly like it used to
        // read JSON.parse(localStorage.getItem(...)).
        // ---------------------------------------------------------------
        let agentsCache = [];
        let supportCache = [];
        let feedbackCache = [];

        // NOTE: index.html intentionally does NOT seed default data into
        // Firestore. supervisor.html owns roster management, so open it
        // once (logged in as supervisor) first to seed the shared roster.
        // This page just reads whatever is already in the database.
        function attachRealtimeListeners() {
            db.collection(AGENT_COLLECTION).onSnapshot(function(snap) {
                agentsCache = snap.docs.map(d => d.data());
                loadAgentDropdown();
                checkAgentCredits();
            }, function(err) { console.error('agentRoster listener error:', err); });

            db.collection(SUPPORT_COLLECTION).onSnapshot(function(snap) {
                supportCache = snap.docs.map(d => d.data());
                loadSupportDropdown();
            }, function(err) { console.error('supportRoster listener error:', err); });

            db.collection(FEEDBACK_COLLECTION).onSnapshot(function(snap) {
                feedbackCache = snap.docs.map(d => d.data());
                checkAgentCredits();
                checkSupportLimit();
            }, function(err) { console.error('feedback listener error:', err); });
        }

        function loadAgentDropdown() {
            const agents = agentsCache;
            const select = document.getElementById('agentUser');

            const mnlGroup = document.getElementById('agent-opt-manila');
            const tucGroup = document.getElementById('agent-opt-tucson');
            const blrGroup = document.getElementById('agent-opt-bangalore');
            const canGroup = document.getElementById('agent-opt-canada');

            // Preserve whatever the user has currently selected across live re-renders.
            const currentVal = select.value;

            mnlGroup.innerHTML = '';
            tucGroup.innerHTML = '';
            blrGroup.innerHTML = '';
            canGroup.innerHTML = '';

            // If the supervisor hasn't loaded any agents into Firestore yet,
            // show a clear, disabled placeholder instead of an empty list.
            let emptyNotice = document.getElementById('agentEmptyNotice');
            if (agents.length === 0) {
                if (!emptyNotice) {
                    emptyNotice = document.createElement('option');
                    emptyNotice.id = 'agentEmptyNotice';
                    emptyNotice.disabled = true;
                    emptyNotice.textContent = '-- No agents configured yet, contact your supervisor --';
                    select.appendChild(emptyNotice);
                }
            } else if (emptyNotice) {
                emptyNotice.remove();
            }

            [...agents].sort((a, b) => a.name.localeCompare(b.name)).forEach(agent => {
                const opt = document.createElement('option');
                opt.value = agent.name;
                opt.textContent = agent.name;

                const loc = (agent.location || '').toLowerCase();
                if (loc.includes('manila') || loc.includes('mnl')) mnlGroup.appendChild(opt);
                else if (loc.includes('tucson') || loc.includes('tus')) tucGroup.appendChild(opt);
                else if (loc.includes('bangalore') || loc.includes('blr')) blrGroup.appendChild(opt);
                else if (loc.includes('canada') || loc.includes('mis')) canGroup.appendChild(opt);
                else mnlGroup.appendChild(opt);
            });

            if (currentVal) select.value = currentVal;
        }

        function loadSupportDropdown() {
            const roster = supportCache;
            const select = document.getElementById('supportPerson');

            const mnlGroup = document.getElementById('support-opt-manila');
            const tucGroup = document.getElementById('support-opt-tucson');

            const currentVal = select.value;

            mnlGroup.innerHTML = '';
            tucGroup.innerHTML = '';

            let emptyNotice = document.getElementById('supportEmptyNotice');
            if (roster.length === 0) {
                if (!emptyNotice) {
                    emptyNotice = document.createElement('option');
                    emptyNotice.id = 'supportEmptyNotice';
                    emptyNotice.disabled = true;
                    emptyNotice.textContent = '-- No support staff configured yet, contact your supervisor --';
                    select.appendChild(emptyNotice);
                }
            } else if (emptyNotice) {
                emptyNotice.remove();
            }

            roster.forEach(member => {
                const opt = document.createElement('option');
                opt.value = member.name;
                opt.textContent = member.name;

                if (member.team === 'Manila') mnlGroup.appendChild(opt);
                else tucGroup.appendChild(opt);
            });

            if (currentVal) select.value = currentVal;
        }

        function handleAgentChange() {
            const selectVal = document.getElementById('agentUser').value;
            const customBox = document.getElementById('customAgentContainer');
            const customInput = document.getElementById('customAgentInput');

            if (selectVal === '__CUSTOM_AGENT__') {
                customBox.classList.remove('hidden');
                customInput.required = true;
            } else {
                customBox.classList.add('hidden');
                customInput.required = false;
            }

            checkAgentCredits();
            checkSupportLimit();
        }

        function handleSupportChange() {
            const selectVal = document.getElementById('supportPerson').value;
            const customBox = document.getElementById('customSupportContainer');
            const customInput = document.getElementById('customSupportInput');

            if (selectVal === '__CUSTOM_SUPPORT__') {
                customBox.classList.remove('hidden');
                customInput.required = true;
            } else {
                customBox.classList.add('hidden');
                customInput.required = false;
            }

            checkSupportLimit();
        }

        // Credits reset every calendar month: only submissions made in the
        // current month/year count against the limit, so an agent who used
        // all 4 in October automatically has 4 fresh ones again in November.
        function getAgentSubmissionsThisMonth(agentName) {
            if (!agentName) return [];
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1; // 1-12

            return feedbackCache.filter(s => {
                if ((s.agentUser || '').toLowerCase() !== agentName.toLowerCase()) return false;
                const d = s.dateISO ? new Date(s.dateISO + 'T00:00:00') : new Date(s.timestamp);
                if (isNaN(d.getTime())) return false;
                return d.getFullYear() === currentYear && (d.getMonth() + 1) === currentMonth;
            });
        }

        function getAgentRemainingCredits(agentName) {
            if (!agentName) return INITIAL_CREDITS;
            return Math.max(0, INITIAL_CREDITS - getAgentSubmissionsThisMonth(agentName).length);
        }

        // Prevents the same agent from rating the same support person more
        // than MAX_SUBMISSIONS_PER_SUPPORT times.
        const MAX_SUBMISSIONS_PER_SUPPORT = 2;
        let creditsExhausted = false;
        let supportLimitReached = false;

        // Feedback notes must contain at least MIN_NOTES_WORDS words before
        // the submit button is enabled. Starts true because the field
        // starts empty.
        const MIN_NOTES_WORDS = 20;
        let notesMissing = true;

        function updateSubmitButtonState() {
            document.getElementById('submitBtn').disabled = creditsExhausted || supportLimitReached || notesMissing;
        }

        function countWords(text) {
            const trimmed = text.trim();
            if (!trimmed) return 0;
            return trimmed.split(/\s+/).length;
        }

        function checkNotesProvided() {
            const notesField = document.getElementById('notes');
            const hint = document.getElementById('notesHint');
            const wordCount = countWords(notesField.value);
            const hasEnoughWords = wordCount >= MIN_NOTES_WORDS;

            notesMissing = !hasEnoughWords;

            notesField.classList.remove('notes-missing');
            hint.classList.remove('notes-hint-warning');

            if (hasEnoughWords) {
                hint.textContent = `Thanks for sharing your feedback! (${wordCount} words)`;
            } else {
                hint.textContent = `Please provide at least ${MIN_NOTES_WORDS} words of feedback (${wordCount} / ${MIN_NOTES_WORDS} words so far).`;
            }

            updateSubmitButtonState();
        }

        function getSelectedAgentName() {
            let val = document.getElementById('agentUser').value;
            if (val === '__CUSTOM_AGENT__') {
                val = document.getElementById('customAgentInput').value.trim();
            }
            return val;
        }

        function getSelectedSupportName() {
            let val = document.getElementById('supportPerson').value;
            if (val === '__CUSTOM_SUPPORT__') {
                val = document.getElementById('customSupportInput').value.trim();
            }
            return val;
        }

        function getPairSubmissionCount(agentName, supportName) {
            if (!agentName || !supportName) return 0;
            return feedbackCache.filter(s =>
                (s.agentUser || '').toLowerCase() === agentName.toLowerCase() &&
                (s.supportName || '').toLowerCase() === supportName.toLowerCase()
            ).length;
        }

        function checkSupportLimit() {
            const agentName = getSelectedAgentName();
            const supportName = getSelectedSupportName();
            const notice = document.getElementById('supportLimitNotice');

            if (!agentName || !supportName) {
                notice.classList.add('hidden');
                supportLimitReached = false;
                updateSubmitButtonState();
                return;
            }

            const count = getPairSubmissionCount(agentName, supportName);

            if (count >= MAX_SUBMISSIONS_PER_SUPPORT) {
                notice.textContent = `Looks like you've already shared feedback for ${supportName} ${MAX_SUBMISSIONS_PER_SUPPORT} times. To keep things fair for everyone, please pick a different support person for this submission.`;
                notice.classList.remove('hidden');
                notice.classList.add('limit-notice-warning');
                supportLimitReached = true;
            } else {
                notice.classList.add('hidden');
                notice.classList.remove('limit-notice-warning');
                supportLimitReached = false;
            }

            updateSubmitButtonState();
        }

        function checkAgentCredits() {
            let selectVal = document.getElementById('agentUser').value;
            let agentName = selectVal;

            if (selectVal === '__CUSTOM_AGENT__') {
                agentName = document.getElementById('customAgentInput').value.trim();
            }

            const badge = document.getElementById('creditBadge');

            if (!agentName) {
                badge.classList.add('hidden');
                creditsExhausted = false;
                updateSubmitButtonState();
                return;
            }

            const remaining = getAgentRemainingCredits(agentName);
            badge.classList.remove('hidden', 'badge-success', 'badge-warning', 'badge-danger');
            badge.textContent = `${remaining} / ${INITIAL_CREDITS} Credits Left This Month`;

            if (remaining > 2) {
                badge.classList.add('badge-success');
                creditsExhausted = false;
            } else if (remaining > 0) {
                badge.classList.add('badge-warning');
                creditsExhausted = false;
            } else {
                badge.classList.add('badge-danger');
                badge.textContent = "0 Credits Left This Month (resets next month)";
                creditsExhausted = true;
            }

            updateSubmitButtonState();
        }

        document.getElementById('customAgentInput').addEventListener('input', function() {
            checkAgentCredits();
            checkSupportLimit();
        });

        document.getElementById('customSupportInput').addEventListener('input', checkSupportLimit);

        // Live-validate the notes/feedback field as the agent types.
        document.getElementById('notes').addEventListener('input', checkNotesProvided);

        // Set the initial state of the notes hint/submit button on page load.
        checkNotesProvided();

        document.getElementById('ratingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Extra safety net in case the button state ever gets out of sync -
            // block submission if the feedback notes don't meet the minimum
            // word count.
            const notesField = document.getElementById('notes');
            const notesWordCount = countWords(notesField.value);
            if (notesWordCount < MIN_NOTES_WORDS) {
                checkNotesProvided();
                notesField.classList.add('notes-missing');
                document.getElementById('notesHint').classList.add('notes-hint-warning');
                document.getElementById('notesHint').textContent = `Feedback must be at least ${MIN_NOTES_WORDS} words (${notesWordCount} / ${MIN_NOTES_WORDS} words so far).`;
                notesField.focus();
                return;
            }

            let selectedAgent = document.getElementById('agentUser').value;
            if (selectedAgent === '__CUSTOM_AGENT__') {
                selectedAgent = document.getElementById('customAgentInput').value.trim();
            }

            const creditsLeft = getAgentRemainingCredits(selectedAgent);

            if (creditsLeft <= 0) {
                alert('You have used all 4 feedback submission credits for this month. New credits will be available next month.');
                return;
            }

            let selectedSupport = document.getElementById('supportPerson').value;
            let supportTeam = 'Unknown';

            if (selectedSupport === '__CUSTOM_SUPPORT__') {
                selectedSupport = document.getElementById('customSupportInput').value.trim();
                supportTeam = document.getElementById('customSupportTeam').value;
            } else {
                const personObj = supportCache.find(m => m.name === selectedSupport);
                if (personObj) supportTeam = personObj.team;
            }

            const pairCount = getPairSubmissionCount(selectedAgent, selectedSupport);
            if (pairCount >= MAX_SUBMISSIONS_PER_SUPPORT) {
                alert(`You've already shared feedback for ${selectedSupport} ${MAX_SUBMISSIONS_PER_SUPPORT} times. Please choose a different support person to submit new feedback.`);
                return;
            }

            const now = new Date();
            const dateISO = now.toISOString().split('T')[0];
            const yearStr = String(now.getFullYear());

            const tempDate = new Date(now.valueOf());
            const dayNum = (now.getDay() + 6) % 7;
            tempDate.setDate(tempDate.getDate() - dayNum + 3);
            const firstThursday = tempDate.valueOf();
            tempDate.setMonth(0, 1);
            if (tempDate.getDay() !== 4) {
                tempDate.setMonth(0, 1 + ((4 - tempDate.getDay() + 7) % 7));
            }
            const weekNum = 1 + Math.round((firstThursday - tempDate.valueOf()) / 604800000);

            const formattedDate = `${now.getMonth()+1}/${now.getDate()}/${now.getFullYear()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const newEntry = {
                id: Date.now(),
                timestamp: formattedDate,
                dateISO: dateISO,
                year: yearStr,
                week: String(weekNum),
                agentUser: selectedAgent,
                caseNumber: "N/A",
                supportName: selectedSupport,
                team: supportTeam,
                rating: parseInt(document.getElementById('rating').value),
                comments: document.getElementById('notes').value.trim()
            };

            const submitBtn = document.getElementById('submitBtn');
            const originalBtnText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'SUBMITTING...';

            db.collection(FEEDBACK_COLLECTION).doc(String(newEntry.id)).set(newEntry)
                .then(() => {
                    alert(`Thank you! Your feedback has been recorded. You have ${creditsLeft - 1} credit(s) remaining this month.`);
                    this.reset();
                    document.getElementById('customAgentContainer').classList.add('hidden');
                    document.getElementById('customSupportContainer').classList.add('hidden');
                    document.getElementById('supportLimitNotice').classList.add('hidden');
                    checkAgentCredits();
                    checkSupportLimit();
                    checkNotesProvided();
                })
                .catch((err) => {
                    console.error('Error saving feedback:', err);
                    alert('Sorry, something went wrong saving your feedback. Please check your internet connection and try again.');
                })
                .finally(() => {
                    submitBtn.textContent = originalBtnText;
                    submitBtn.disabled = creditsExhausted || supportLimitReached || notesMissing;
                });
        });

        attachRealtimeListeners();
    </script>
</body>
</html>
